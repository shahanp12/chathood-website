e0f5"/><image href="/assets/icons/whatsapp.svg" x="354" y="195" width="28" height="28"/><text x="394" y="202" font-size="11" font-weight="900" fill="#17304f">Ayaan Khan</text><text x="394" y="218" font-size="8" fill="#7890a8">WhatsApp · Sales · 11:28 AM</text><text x="514" y="210" font-size="9" fill="#3d5872">Do you have a discount on bulk orders?</text><rect x="340" y="250" width="378" height="62" rx="12" fill="#fff" stroke="#e0e7ef"/><image href="/assets/icons/telegram.svg" x="354" y="265" width="28" height="28"/><text x="394" y="272" font-size="11" font-weight="900" fill="#17304f">Daniel Thomas</text><text x="394" y="288" font-size="8" fill="#7890a8">Telegram · Support · 11:24 AM</text><text x="514" y="280" font-size="9" fill="#3d5872">When will my order be delivered?</text><rect x="340" y="320" width="378" height="62" rx="12" fill="#fff" stroke="#e0e7ef"/><image href="/assets/icons/instagram.svg" x="354" y="335" width="28" height="28"/><text x="394" y="342" font-size="11" font-weight="900" fill="#17304f">Aisha Rahman</text><text x="394" y="358" font-size="8" fill="#7890a8">Instagram · Sales · 11:20 AM</text><text x="514" y="350" font-size="9" fill="#3d5872">Please share your premium plan details.</text><rect x="340" y="390" width="378" height="62" rx="12" fill="#fff" stroke="#e0e7ef"/><image href="/assets/icons/facebook.svg" x="354" y="405" width="28" height="28"/><text x="394" y="412" font-size="11" font-weight="900" fill="#17304f">Maria D'Souza</text><text x="394" y="428" font-size="8" fill="#7890a8">Facebook · Support · 11:16 AM</text><text x="514" y="420" font-size="9" fill="#3d5872">Please send the product catalogue.</text><rect x="340" y="460" width="378" height="62" rx="12" fill="#fffdf5" stroke="#eee2bf"/><image href="/assets/icons/line.svg" x="354" y="475" width="28" height="28"/><text x="394" y="482" font-size="11" font-weight="900" fill="#17304f">Omar Farooq</text><text x="394" y="498" font-size="8" fill="#7890a8">LINE · New customer · 11:08 AM</text><text x="514" y="490" font-size="9" fill="#3d5872">Can you send me the catalogue?</text><rect x="340" y="530" width="378" height="62" rx="12" fill="#fff" stroke="#e0e7ef"/><image href="/assets/icons/linkedin.svg" x="354" y="545" width="28" height="28"/><text x="394" y="552" font-size="11" font-weight="900" fill="#17304f">Michael Joseph</text><text x="394" y="568" font-size="8" fill="#7890a8">LinkedIn · Sales · 11:04 AM</text><text x="514" y="560" font-size="9" fill="#3d5872">Interested in an enterprise workspace.</text><rect x="340" y="600" width="378" height="62" rx="12" fill="#f8fbff" stroke="#e0e7ef"/><image href="/assets/icons/email-modern.svg" x="354" y="615" width="28" height="28"/><text x="394" y="622" font-size="11" font-weight="900" fill="#17304f">Sarah Thomas</text><text x="394" y="638" font-size="8" fill="#7890a8">Email · Support · 10:58 AM</text><text x="514" y="630" font-size="9" fill="#3d5872">How does Chathood handle routing?</text></g><rect x="754" y="112" width="692" height="598" fill="#fbfdff" stroke="#d9e3ec"/><rect x="754" y="112" width="692" height="54" fill="#f8fbfe"/><image href="/assets/icons/linkedin.svg" x="774" y="126" width="26" height="26"/><text x="812" y="140" font-family="Arial,sans-serif" font-size="13" font-weight="900" fill="#17304f">Michael Joseph</text><text x="812" y="155" font-family="Arial,sans-serif" font-size="8" fill="#7890a8">LinkedIn · Sales · Enterprise lead</text><text x="1400" y="144" font-family="Arial,sans-serif" font-size="8" font-weight="800" fill="#35a8ff">ASSIGNED</text><line x1="770" y1="178" x2="1430" y2="178" stroke="#e3eaf1"/><text x="778" y="200" font-family="Arial,sans-serif" font-size="8" font-weight="900" letter-spacing="1.5" fill="#8a9cad">CONVERSATION</text><rect x="778" y="214" width="372" height="58" rx="15" fill="#eef4f8"/><text x="800" y="238" font-family="Arial,sans-serif" font-size="10" fill="#334d67">Hi, I found you on LinkedIn. Can you share enterprise</text><text x="800" y="254" font-family="Arial,sans-serif" font-size="10" fill="#334d67">pricing and onboarding details?</text><rect x="900" y="292" width="410" height="62" rx="15" fill="#dff0ff"/><text x="922" y="317" font-family="Arial,sans-serif" font-size="10" fill="#294966">Sure — our team can configure channels, routing</text><text x="922" y="333" font-family="Arial,sans-serif" font-size="10" fill="#294966">and automation around your operation.</text><rect x="778" y="376" width="532" height="76" rx="15" fill="#fff7df" stroke="#eedaa4"/><text x="800" y="400" font-family="Arial,sans-serif" font-size="10" font-weight="900" fill="#7d5b18">INTERNAL NOTE</text><text x="800" y="420" font-family="Arial,sans-serif" font-size="9" fill="#725f3c">Enterprise lead · route to sales · send onboarding pack</text><text x="800" y="437" font-family="Arial,sans-serif" font-size="8" fill="#8a7651">Added by Noor Ahmed · 11:32 AM</text><text x="778" y="480" font-family="Arial,sans-serif" font-size="8" font-weight="900" letter-spacing="1.5" fill="#8a9cad">CUSTOMER CONTEXT</text><rect x="778" y="496" width="245" height="90" rx="13" fill="#fff" stroke="#e0e7ef"/><text x="798" y="521" font-family="Arial,sans-serif" font-size="9" font-weight="900" fill="#17304f">CONTACT</text><text x="798" y="542" font-family="Arial,sans-serif" font-size="9" fill="#526a81">michael@example.com</text><text x="798" y="560" font-family="Arial,sans-serif" font-size="9" fill="#526a81">+91 98765 43210</text><rect x="1038" y="496" width="272" height="90" rx="13" fill="#fff" stroke="#e0e7ef"/><text x="1058" y="521" font-family="Arial,sans-serif" font-size="9" font-weight="900" fill="#17304f">WORKFLOW</text><text x="1058" y="542" font-family="Arial,sans-serif" font-size="9" fill="#526a81">Enterprise routing · Sales queue</text><text x="1058" y="560" font-family="Arial,sans-serif" font-size="9" fill="#526a81">SLA · 2h response target</text><rect x="778" y="604" width="532" height="46" rx="13" fill="#fff" stroke="#dce6ef"/><text x="798" y="632" font-family="Arial,sans-serif" font-size="9" fill="#9aaaba">Reply to Michael...</text><rect x="1238" y="614" width="58" height="26" rx="9" fill="url(#blue)"/><text x="1253" y="631" font-family="Arial,sans-serif" font-size="8" font-weight="900" fill="#fff">SEND</text></g></svg>