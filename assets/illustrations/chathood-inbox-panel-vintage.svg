app.svg" x="426" y="247" width="29" height="29"/><text x="468" y="253" font-size="12" font-weight="900" fill="#17304f">Ayaan Khan</text><text x="468" y="270" font-size="9" fill="#70869b">WhatsApp · Sales · 11:28 AM</text><text x="610" y="260" font-size="10" fill="#3d5872">Can you share the enterprise plan?</text><rect x="410" y="306" width="390" height="65" rx="13" fill="#fff" stroke="#e0e7ef"/><image href="/assets/icons/telegram.svg" x="426" y="323" width="29" height="29"/><text x="468" y="329" font-size="12" font-weight="900" fill="#17304f">Aisha Rahman</text><text x="468" y="346" font-size="9" fill="#70869b">Telegram · Support · 11:24 AM</text><text x="610" y="336" font-size="10" fill="#3d5872">When will my order be delivered?</text><rect x="410" y="382" width="390" height="65" rx="13" fill="#fff" stroke="#e0e7ef"/><image href="/assets/icons/instagram.svg" x="426" y="399" width="29" height="29"/><text x="468" y="405" font-size="12" font-weight="900" fill="#17304f">Maria D'Souza</text><text x="468" y="422" font-size="9" fill="#70869b">Instagram · Sales · 11:20 AM</text><text x="610" y="412" font-size="10" fill="#3d5872">Please share your premium plan details.</text><rect x="410" y="458" width="390" height="65" rx="13" fill="#fff" stroke="#e0e7ef"/><image href="/assets/icons/facebook.svg" x="426" y="475" width="29" height="29"/><text x="468" y="481" font-size="12" font-weight="900" fill="#17304f">Daniel Thomas</text><text x="468" y="498" font-size="9" fill="#70869b">Facebook · Support · 11:16 AM</text><text x="610" y="488" font-size="10" fill="#3d5872">Please send the product catalogue.</text><rect x="410" y="534" width="390" height="65" rx="13" fill="#fffdf5" stroke="#eee2bf"/><image href="/assets/icons/line.svg" x="426" y="551" width="29" height="29"/><text x="468" y="557" font-size="12" font-weight="900" fill="#17304f">Omar Farooq</text><text x="468" y="574" font-size="9" fill="#70869b">LINE · New customer · 11:08 AM</text><text x="610" y="564" font-size="10" fill="#3d5872">Can you send me the catalogue?</text><rect x="410" y="610" width="390" height="65" rx="13" fill="#fff" stroke="#e0e7ef"/><image href="/assets/icons/linkedin.svg" x="426" y="627" width="29" height="29"/><text x="468" y="633" font-size="12" font-weight="900" fill="#17304f">Michael Joseph</text><text x="468" y="650" font-size="9" fill="#70869b">LinkedIn · Sales · 11:04 AM</text><text x="610" y="640" font-size="10" fill="#3d5872">Interested in an enterprise workspace.</text></g><rect x="840" y="155" width="680" height="665" fill="#fbfdff" stroke="#d7e2ed"/><image href="/assets/brand/hood-mark.svg" x="870" y="184" width="48" height="48"/><text x="930" y="202" font-family="Arial,sans-serif" font-size="16" font-weight="900" fill="#17304f">Customer conversation</text><text x="930" y="222" font-family="Arial,sans-serif" font-size="9" fill="#70869b">MULTI-CHANNEL CONTACT · ASSIGNED TO SALES</text><line x1="868" y1="245" x2="1492" y2="245" stroke="#e3ebf3"/><rect x="880" y="270" width="430" height="66" rx="16" fill="#eef4f8"/><text x="905" y="297" font-family="Arial,sans-serif" font-size="11" fill="#334d67">Hi, I found you on LinkedIn. Can you share enterprise</text><text x="905" y="315" font-family="Arial,sans-serif" font-size="11" fill="#334d67">pricing and onboarding details?</text><image href="/assets/icons/linkedin.svg" x="1270" y="286" width="24" height="24"/><rect x="1030" y="360" width="440" height="70" rx="16" fill="#dff0ff"/><text x="1055" y="389" font-family="Arial,sans-serif" font-size="11" fill="#294966">Sure — our team can configure the workspace around your</text><text x="1055" y="407" font-family="Arial,sans-serif" font-size="11" fill="#294966">channels, teams, routing and automation.</text><image href="/assets/brand/hood-mark.svg" x="1428" y="380" width="24" height="24"/><rect x="880" y="458" width="350" height="64" rx="16" fill="#fff4ea"/><image href="/assets/icons/whatsapp.svg" x="900" y="478" width="24" height="24"/><text x="938" y="486" font-family="Arial,sans-serif" font-size="11" fill="#5a463b">New enterprise lead assigned to Sales.</text><rect x="1010" y="548" width="460" height="64" rx="16" fill="#eaf8ed"/><image href="/assets/icons/line.svg" x="1030" y="568" width="24" height="24"/><text x="1068" y="576" font-family="Arial,sans-serif" font-size="11" fill="#31553a">LINE catalogue request assigned to Support.</text><rect x="880" y="642" width="590" height="58" rx="15" fill="#fff" stroke="#dbe5ee"/><text x="905" y="677" font-family="Arial,sans-serif" font-size="11" fill="#9aa9b7">Type a reply…</text><rect x="1370" y="655" width="78" height="32" rx="10" fill="url(#blue)"/><text x="1409" y="676" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="900" fill="#fff">SEND</text></g></svg>