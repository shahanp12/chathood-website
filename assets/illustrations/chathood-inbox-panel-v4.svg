text><text x="396" y="296" font-size="8" fill="#7890a8">Telegram · Support · 11:24 AM</text><text x="510" y="288" font-size="9" fill="#3d5872">When will my order be delivered?</text><rect x="342" y="328" width="369" height="62" rx="12" fill="#fff" stroke="#e0e7ef"/><image href="/assets/icons/instagram.svg" x="356" y="343" width="28" height="28"/><text x="396" y="350" font-size="11" font-weight="900" fill="#17304f">Aisha Rahman</text><text x="396" y="366" font-size="8" fill="#7890a8">Instagram · Sales · 11:20 AM</text><text x="510" y="358" font-size="9" fill="#3d5872">Please share your premium plan details.</text><rect x="342" y="398" width="369" height="62" rx="12" fill="#fff" stroke="#e0e7ef"/><image href="/assets/icons/facebook.svg" x="356" y="413" width="28" height="28"/><text x="396" y="420" font-size="11" font-weight="900" fill="#17304f">Maria D'Souza</text><text x="396" y="436" font-size="8" fill="#7890a8">Facebook · Support · 11:16 AM</text><text x="510" y="428" font-size="9" fill="#3d5872">Please send the product catalogue.</text><rect x="342" y="468" width="369" height="62" rx="12" fill="#fffdf5" stroke="#eee2bf"/><image href="/assets/icons/line.svg" x="356" y="483" width="28" height="28"/><text x="396" y="490" font-size="11" font-weight="900" fill="#17304f">Omar Farooq</text><text x="396" y="506" font-size="8" fill="#7890a8">LINE · New customer · 11:08 AM</text><text x="510" y="498" font-size="9" fill="#3d5872">Can you send me the catalogue?</text><rect x="342" y="538" width="369" height="62" rx="12" fill="#fff" stroke="#e0e7ef"/><image href="/assets/icons/linkedin.svg" x="356" y="553" width="28" height="28"/><text x="396" y="560" font-size="11" font-weight="900" fill="#17304f">Michael Joseph</text><text x="396" y="576" font-size="8" fill="#7890a8">LinkedIn · Sales · 11:04 AM</text><text x="510" y="568" font-size="9" fill="#3d5872">Interested in an enterprise workspace.</text><rect x="342" y="608" width="369" height="62" rx="12" fill="#f8fbff" stroke="#e0e7ef"/><image href="/assets/icons/email.svg" x="356" y="623" width="28" height="28"/><text x="396" y="630" font-size="11" font-weight="900" fill="#17304f">Sarah Thomas</text><text x="396" y="646" font-size="8" fill="#7890a8">Email · Support · 10:58 AM</text><text x="510" y="638" font-size="9" fill="#3d5872">How does Chathood handle routing?</text></g><rect x="745" y="118" width="717" height="586" fill="#fbfdff" stroke="#d9e3ec"/><rect x="745" y="118" width="717" height="48" fill="#f8fbfe"/><image href="/assets/icons/linkedin.svg" x="765" y="130" width="25" height="25"/><text x="800" y="143" font-family="Arial,sans-serif" font-size="13" font-weight="900" fill="#17304f">Michael Joseph</text><text x="800" y="158" font-family="Arial,sans-serif" font-size="8" fill="#7890a8">LinkedIn · Sales · Enterprise lead</text><line x1="760" y1="177" x2="1442" y2="177" stroke="#e3eaf1"/><text x="770" y="199" font-family="Arial,sans-serif" font-size="8" font-weight="900" letter-spacing="1.5" fill="#8a9cad">CONVERSATION</text><rect x="770" y="214" width="370" height="58" rx="15" fill="#eef4f8"/><text x="792" y="238" font-family="Arial,sans-serif" font-size="10" fill="#334d67">Hi, I found you on LinkedIn. Can you share enterprise</text><text x="792" y="254" font-family="Arial,sans-serif" font-size="10" fill="#334d67">pricing and onboarding details?</text><image href="/assets/icons/linkedin.svg" x="1105" y="230" width="22" height="22"/><rect x="900" y="292" width="390" height="62" rx="15" fill="#dff0ff"/><text x="922" y="317" font-family="Arial,sans-serif" font-size="10" fill="#294966">Sure — our team can configure the workspace around</text><text x="922" y="333" font-family="Arial,sans-serif" font-size="10" fill="#294966">channels, teams, routing and automation.</text><rect x="770" y="376" width="520" height="78" rx="15" fill="#fff7df" stroke="#eedaa4"/><text x="792" y="400" font-family="Arial,sans-serif" font-size="10" font-weight="900" fill="#7d5b18">INTERNAL NOTE</text><text x="792" y="420" font-family="Arial,sans-serif" font-size="9" fill="#725f3c">Enterprise lead · route to sales · send onboarding pack</text><text x="792" y="438" font-family="Arial,sans-serif" font-size="8" fill="#8a7651">Added by Noor Ahmed · 11:32 AM</text><text x="770" y="482" font-family="Arial,sans-serif" font-size="8" font-weight="900" letter-spacing="1.5" fill="#8a9cad">CUSTOMER CONTEXT</text><rect x="770" y="496" width="245" height="88" rx="13" fill="#fff" stroke="#e0e7ef"/><text x="790" y="521" font-family="Arial,sans-serif" font-size="9" font-weight="900" fill="#17304f">CONTACT</text><text x="790" y="542" font-family="Arial,sans-serif" font-size="9" fill="#526a81">michael@example.com</text><text x="790" y="560" font-family="Arial,sans-serif" font-size="9" fill="#526a81">+91 98765 43210</text><rect x="1030" y="496" width="260" height="88" rx="13" fill="#fff" stroke="#e0e7ef"/><text x="1050" y="521" font-family="Arial,sans-serif" font-size="9" font-weight="900" fill="#17304f">WORKFLOW</text><text x="1050" y="542" font-family="Arial,sans-serif" font-size="9" fill="#526a81">Assigned: Sales Team</text><text x="1050" y="560" font-family="Arial,sans-serif" font-size="9" fill="#526a81">Priority: High · SLA: 4h</text><rect x="770" y="606" width="520" height="52" rx="13" fill="#fff" stroke="#d9e4ee"/><text x="790" y="637" font-family="Arial,sans-serif" font-size="9" fill="#9aaabd">Type a message...</text><rect x="1242" y="616" width="36" height="32" rx="10" fill="url(#b)"/><text x="1254" y="637" font-family="Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">➤</text></g></svg>